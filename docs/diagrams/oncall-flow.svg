  <g>
    <text x="380" y="114" font-size="16" font-weight="600" fill="#1F3A5F">客户端 / 告警源</text>
    <text x="380" y="131" font-size="14" fill="#1F3A5F">HTTP 请求 · SSE 流式</text>
    <text x="380" y="148" font-size="14" fill="#1F3A5F">Alertmanager v4 webhook</text>
    <text x="380" y="204" font-size="16" font-weight="600" fill="#1F3A5F">API 层 · FastAPI（M9）</text>
    <text x="380" y="221" font-size="14" fill="#1F3A5F">路由 · 生命周期 · Pydantic 校验</text>
    <text x="380" y="238" font-size="14" fill="#1F3A5F">SSE 响应（sse-starlette）</text>
    <text x="380" y="294" font-size="16" font-weight="600" fill="#1F3A5F">Query 理解（M4）· 规则优先</text>
    <text x="380" y="311" font-size="14" fill="#1F3A5F">错误码正则 6 类 · 资源类型 26 词</text>
    <text x="380" y="328" font-size="14" fill="#1F3A5F">事件原因 40 词 · 意图分类 → 子库路由</text>
    <text x="380" y="384" font-size="16" font-weight="600" fill="#1F3A5F">向量召回</text>
    <text x="380" y="401" font-size="14" fill="#1F3A5F">LanceDB · bge-m3</text>
    <text x="380" y="418" font-size="14" fill="#1F3A5F">1024 维 · Top20</text>
    <text x="592" y="384" font-size="16" font-weight="600" fill="#1F3A5F">BM25 召回</text>
    <text x="592" y="401" font-size="14" fill="#1F3A5F">jieba 分词</text>
    <text x="592" y="418" font-size="14" fill="#1F3A5F">rank_bm25 · Top20</text>
    <text x="380" y="474" font-size="16" font-weight="600" fill="#1F3A5F">RRF 融合（M5）</text>
    <text x="380" y="491" font-size="14" fill="#1F3A5F">score = Σ 1/(k + rank_i)，k = 60</text>
    <text x="380" y="508" font-size="14" fill="#1F3A5F">只信排名不信分数 → 输出 Top20</text>
    <text x="380" y="564" font-size="16" font-weight="600" fill="#1F3A5F">Cross-Encoder 重排（M6）</text>
    <text x="380" y="581" font-size="14" fill="#1F3A5F">bge-reranker-v2-m3 · Top20 → Top5</text>
    <text x="380" y="598" font-size="14" fill="#1F3A5F">接口失败 → 退回 RRF 排序并标 degraded</text>
    <text x="380" y="654" font-size="16" font-weight="600" fill="#B45309">拒答闸门（M8）</text>
    <text x="380" y="671" font-size="14" fill="#B45309">重排 Top1 分数低于 0.35 → 拒答</text>
    <text x="380" y="688" font-size="14" fill="#B45309">ABSTAIN_THRESHOLD，D7 用评测集标定</text>
    <text x="380" y="744" font-size="16" font-weight="600" fill="#1F3A5F">生成（M7）· deepseek-flash</text>
    <text x="380" y="761" font-size="14" fill="#1F3A5F">结构化诊断卡 JSON（Pydantic v2）</text>
    <text x="380" y="778" font-size="14" fill="#1F3A5F">causes · verify_commands · actions</text>
    <text x="380" y="834" font-size="16" font-weight="600" fill="#1F3A5F">引用校验（M8）</text>
    <text x="380" y="851" font-size="14" fill="#1F3A5F">chunk_id 不在本轮上下文 → 重生成 1 次</text>
    <text x="380" y="868" font-size="14" fill="#1F3A5F">再失败 → 降级返回原文片段（degraded）</text>
    <text x="380" y="924" font-size="16" font-weight="600" fill="#15803D">输出 · SSE / JSON</text>
    <text x="380" y="941" font-size="14" fill="#15803D">帧序 meta → citations → delta → done</text>
    <text x="380" y="958" font-size="14" fill="#15803D">done 带 latency_ms / ttft_ms / cost_cny</text>
    <text x="60" y="124" font-size="16" font-weight="600" fill="#6B7280">M1 采集</text>
    <text x="60" y="141" font-size="14" fill="#6B7280">scripts/fetch_corpus.py</text>
    <text x="60" y="158" font-size="14" fill="#6B7280">抓 4 个源官网</text>
    <text x="60" y="220" font-size="16" font-weight="600" fill="#6B7280">content/ 语料</text>
    <text x="60" y="237" font-size="14" fill="#6B7280">255 篇 · 214.8 万字</text>
    <text x="60" y="254" font-size="14" fill="#6B7280">磁盘约 3.4 MB</text>
    <text x="60" y="316" font-size="16" font-weight="600" fill="#6B7280">M2 切分 · chunker</text>
    <text x="60" y="333" font-size="14" fill="#6B7280">按 H2/H3 → 2099 块</text>
    <text x="60" y="350" font-size="14" fill="#6B7280">单块 800 token 以内</text>
    <text x="60" y="367" font-size="14" fill="#6B7280">超长切分留 100 重叠</text>
    <text x="60" y="420" font-size="16" font-weight="600" fill="#6B7280">M3 embedder</text>
    <text x="60" y="437" font-size="14" fill="#6B7280">batch 16 · 命中去缓存</text>
    <text x="60" y="454" font-size="14" fill="#6B7280">embed_cache 47 MB</text>
    <text x="60" y="471" font-size="14" fill="#6B7280">2081 条 · key=sha256</text>
    <text x="60" y="524" font-size="16" font-weight="600" fill="#6B7280">M3 索引落地</text>
    <text x="60" y="541" font-size="14" fill="#6B7280">LanceDB 向量 11.5 MB</text>
    <text x="60" y="558" font-size="14" fill="#6B7280">bm25.pkl 6.4 MB · SQLite</text>
    <text x="60" y="575" font-size="14" fill="#6B7280">doc_hash 增量 · 软删标记</text>
    <text x="60" y="628" font-size="16" font-weight="600" fill="#6B7280">索引成本（实测）</text>
    <text x="60" y="645" font-size="14" fill="#6B7280">全量重建 98 s</text>
    <text x="60" y="662" font-size="14" fill="#6B7280">二次运行 0.2 s / 0 次 API</text>
    <text x="60" y="679" font-size="14" fill="#6B7280">改一篇只重算 1 块</text>
    <text x="820" y="187" font-size="14" font-weight="600" fill="#1F3A5F">7 个接口（设计清单 §7）</text>
    <text x="820" y="204" font-size="14" fill="#1F3A5F">/v1/ask · /v1/diagnose · /v1/health</text>
    <text x="820" y="221" font-size="14" fill="#1F3A5F">/webhook/alertmanager（Alertmanager v4 兼容）</text>
    <text x="820" y="238" font-size="14" fill="#1F3A5F">/v1/sources/{chunk_id} · /v1/admin/index</text>
    <text x="820" y="255" font-size="14" fill="#1F3A5F">/v1/metrics/summary</text>
    <text x="820" y="294" font-size="14" font-weight="600" fill="#1F3A5F">规则优先，少调一次 LLM</text>
    <text x="820" y="311" font-size="14" fill="#1F3A5F">未命中且 query 超 20 字才调 LLM（need_llm 2%）</text>
    <text x="820" y="328" font-size="14" fill="#1F3A5F">向量查询文本 = query + 错误码 + 强事件词</text>
    <text x="820" y="384" font-size="14" font-weight="600" fill="#1F3A5F">召回侧实测</text>
    <text x="820" y="401" font-size="14" fill="#1F3A5F">embedding 303 ms（bge-m3，实测 2 条）</text>
    <text x="820" y="418" font-size="14" fill="#1F3A5F">热路径 P50 14 ms / P95 17 ms；冷启动 0.8 s</text>
    <text x="820" y="573" font-size="14" font-weight="600" fill="#1F3A5F">重排实测</text>
    <text x="820" y="590" font-size="14" fill="#1F3A5F">200 ms（bge-reranker-v2-m3，实测 3 条候选）</text>
    <text x="820" y="744" font-size="14" font-weight="600" fill="#1F3A5F">生成耗时（实测）</text>
    <text x="820" y="761" font-size="14" fill="#1F3A5F">约 130 token/s；400 token 约 2.7–3.3 s</text>
    <text x="820" y="778" font-size="14" fill="#1F3A5F">整卡 P50 4.5 s / P95 7.1 s（门槛 4.5 / 8.0 s）</text>
    <text x="820" y="924" font-size="14" font-weight="600" fill="#15803D">首字为什么能到 1.2 s</text>
    <text x="820" y="941" font-size="14" fill="#15803D">检索 + 重排完成即开流，不等 LLM</text>
    <text x="820" y="958" font-size="14" fill="#15803D">先推 meta / citations，正文再用 delta 跟上</text>
    <text x="820" y="654" font-size="16" font-weight="600" fill="#B45309">abstained=true 卡片</text>
    <text x="820" y="671" font-size="14" fill="#B45309">不调 LLM，该路径 1 s 内返回</text>
    <text x="820" y="688" font-size="14" fill="#B45309">SSE 直接给出完整诊断卡</text>
    <text x="40" y="46" font-size="22" font-weight="600" fill="#1F3A5F">On-call Copilot 全链路：在线请求 + 离线索引</text>
    <text x="1360" y="44" font-size="14" fill="#6B7280" text-anchor="end">设计基线 v1.5 ｜ 数字出处见同目录 README.md</text>
    <text x="40" y="84" font-size="14" font-weight="600" fill="#6B7280">旁路 · 索引侧（离线）</text>
    <text x="768" y="656" font-size="14" fill="#B45309">拒答</text>
    <text x="572" y="706" font-size="14" fill="#1F3A5F">通过</text>
    <text x="40" y="758" font-size="14" font-weight="600" fill="#1F3A5F">图例</text>
    <text x="82" y="786" font-size="14" fill="#1F3A5F">主链路（在线请求）</text>
    <text x="82" y="812" font-size="14" fill="#6B7280">索引旁路 / 注解（离线）</text>
    <text x="82" y="838" font-size="14" fill="#B45309">拒答 / 低置信出口</text>
    <text x="82" y="864" font-size="14" fill="#15803D">产物 / 响应</text>
    <text x="40" y="986" font-size="14" fill="#6B7280">实线 = 在线请求　虚线 = 旁路 / 注解　橙色 = 拒答出口　绿色 = 产物　｜　数字出处：README §4 / §5.1 / §5.2，设计清单 §6.5 / §7</text>
  </g>
</svg>
