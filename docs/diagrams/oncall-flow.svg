  <title>On-call Copilot 全链路：在线请求主链路 + 离线索引旁路</title>
  <desc>主链路：客户端/告警源 → API 层 → Query 理解 → 双路召回 → RRF → 重排 → 拒答闸门 → 生成 → 引用校验 → SSE 输出；左侧为离线索引旁路。数字出处见同目录 README.md。</desc>
